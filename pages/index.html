<!doctype html>
<!-- This Mac's page, served by its iterate menu-bar app through the lend (bridge/pages.mjs).
     One file, no build step, no framework: it reads state.json beside it and shows live.mjpeg.
     Its links are relative, so it works under any path a mind gives it (pages/MIND-ROUTE.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>This Mac</title>
<style>
  :root {
    color-scheme: light dark;
    --text: #1d1d1f; --secondary: #6e6e73; --back: #f5f5f7; --card: #ffffff; --line: #d2d2d7;
    --green: #28a745; --orange: #f09a00; --red: #e0352b; --accent: #0a66d8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text: #f5f5f7; --secondary: #a1a1a6; --back: #1c1c1e; --card: #2c2c2e; --line: #3a3a3c; --accent: #4a9bff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; color: var(--text); background: var(--back); }
  main { max-width: 880px; margin: 0 auto; padding: 24px 20px 40px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; }
  h2 { font-size: 12px; font-weight: 600; color: var(--secondary); margin: 0 0 6px; }
  .sub { color: var(--secondary); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .grid .card { margin-bottom: 0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--secondary); margin-right: 6px; vertical-align: 1px; }
  .dot.green { background: var(--green); } .dot.orange { background: var(--orange); } .dot.red { background: var(--red); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  time { color: var(--secondary); font-variant-numeric: tabular-nums; min-width: 44px; }
  .took { margin-left: auto; color: var(--secondary); white-space: nowrap; }
  .failed { color: var(--red); }
  .running { color: var(--red); font-weight: 600; }
  .live { display: flex; flex-direction: column; gap: 10px; }
  .frame { aspect-ratio: 16 / 10; width: 100%; border-radius: 8px; background: var(--back); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  select { font: inherit; }
  .error { color: var(--red); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="mac">This Mac</h1>
    <span class="sub" id="mind"></span>
    <span class="sub" id="at"></span>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Lend</h2>
      <div><span class="dot" id="lend-dot"></span><span id="lend">…</span></div>
    </section>
    <section class="card">
      <h2>Record into the mind</h2>
      <div><span class="dot" id="record-dot"></span><span id="record">…</span></div>
    </section>
  </div>

  <section class="card live" style="margin-top: 14px">
    <h2>Live</h2>
    <div class="frame" id="frame"><span class="sub" id="frame-words">The display shows here while you watch.</span></div>
    <div class="row">
      <button class="primary" id="watch">Watch the Display</button>
      <select id="display" aria-label="Display"></select>
      <span class="sub" id="live-words">At most 4 pictures a second. The Mac's owner sees it in Activity, and it ends after 10 minutes.</span>
    </div>
  </section>

  <section class="card">
    <h2>Activity</h2>
    <ul id="acts"><li class="sub">…</li></ul>
  </section>
  <p class="sub" id="error"></p>
</main>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const LEND = { live: "green", connecting: "orange", reconnecting: "orange", stopped: "red", notAllowed: "red", incompatible: "red" };
  let watching = false;

  function show(state) {
    document.title = `${state.mac} · iterate`;
    $("mac").textContent = state.mac;
    $("mind").textContent = state.mind ? `lent to ${state.mind}` : "lent to no mind";
    $("at").textContent = `as of ${clock(state.at)}`;
    const lend = state.lend ?? {};
    $("lend").textContent = lend.line || lend.phase || "Not known";
    $("lend-dot").className = `dot ${LEND[lend.phase] ?? ""}`;
    const record = state.record ?? {};
    $("record").textContent = record.line || (record.recording ? "Recording" : "Off");
    $("record-dot").className = `dot ${record.recording ? "red" : record.paused ? "orange" : ""}`;
    const acts = state.acts ?? [];
    $("acts").replaceChildren(
      ...(acts.length
        ? acts.map((act) => {
            const li = document.createElement("li");
            const time = document.createElement("time");
            time.textContent = clock(act.startedAt);
            const title = document.createElement("span");
            title.textContent = act.title + (act.detail ? ` · ${act.detail}` : "");
            if (act.failure) title.className = "failed";
            const took = document.createElement("span");
            took.className = act.running ? "took running" : "took";
            took.textContent = act.running ? "running" : act.took ?? "";
            li.append(time, title, took);
            return li;
          })
        : [Object.assign(document.createElement("li"), { className: "sub", textContent: "No act of a mind with this Mac yet." })]),
    );
    const select = $("display");
    const chosen = select.value;
    select.replaceChildren(
      ...(state.displays ?? []).map((display) =>
        Object.assign(document.createElement("option"), {
          value: String(display.display),
          textContent: `${display.name}${display.sharing === "off" ? " (off)" : display.sharing === "ask" ? " (asks)" : ""}`,
        }),
      ),
    );
    if (chosen) select.value = chosen;
    select.hidden = (state.displays ?? []).length < 2;
  }

  async function read() {
    try {
      const answer = await fetch("state.json", { cache: "no-store" });
      if (!answer.ok) throw new Error((await answer.text()).trim() || `The Mac answered ${answer.status}.`);
      show(await answer.json());
      $("error").textContent = "";
    } catch (error) {
      $("error").textContent = error.message;
      $("error").className = "error";
    }
  }

  function stop(words) {
    watching = false;
    $("frame").replaceChildren(Object.assign(document.createElement("span"), { className: "sub", textContent: words }));
    $("watch").textContent = "Watch the Display";
  }

  $("watch").addEventListener("click", () => {
    if (watching) return stop("The display shows here while you watch.");
    watching = true;
    $("watch").textContent = "Stop";
    const img = new Image();
    img.alt = "The Mac's display, live";
    // an image that ends or is refused: the page says so; removing it ends the view on the Mac
    img.addEventListener("error", () => watching && stop("The live view ended, or the Mac's owner has it off. Press Watch to try again."));
    img.src = `live.mjpeg?display=${encodeURIComponent($("display").value || "0")}`;
    $("frame").replaceChildren(img);
  });

  await read();
  setInterval(read, 10_000);
</script>
</body>
</html>
