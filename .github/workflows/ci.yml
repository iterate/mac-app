# Every pull request and every push to main: the app builds, its tests pass, the bridge's
# scripts parse, the bridges' tests pass, every view draws as its baseline, and the app runs its
# scenarios with no hand (README, "Testing with no hand").
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: swift build
      - run: swift test
      - run: for file in bridge/*.mjs bridge/*.ts cli.mjs harness/*.mjs; do node --check "$file"; done
      - run: node --test 'bridge/*.test.mjs'
      # Every view against harness/baselines/: strict on the macOS build that made them, a check
      # of the layout on another. The drawings and the differences can be looked at.
      - run: node harness/snapshots.mjs --out "$RUNNER_TEMP/snapshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
      # The app started in a home of its own and driven through its control socket.
      - run: node harness/run.mjs ci
