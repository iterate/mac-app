# Every pull request and every push to main: the app builds, its tests pass, the bridge's
# scripts parse, and the bridges' tests pass.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: swift build
      - run: swift test
      - run: for file in bridge/*.mjs bridge/*.ts cli.mjs; do node --check "$file"; done
      - run: node --test 'bridge/*.test.mjs'
